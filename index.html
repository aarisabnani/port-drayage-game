<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Drayage Routing Game</title>
<style>
  :root{
    --bg:#faf9f5; --surface:#ffffff; --surface2:#f1efe8; --road:#e8e6dd;
    --text:#2c2c2a; --text2:#5f5e5a; --border:rgba(0,0,0,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;padding:24px}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:22px;font-weight:500;margin:0 0 4px}
  .sub{color:var(--text2);font-size:14px;margin:0 0 20px}
  .board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface2);padding:10px;border-radius:12px}
  .cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:500;cursor:pointer;border:.5px solid var(--border);
    background:var(--surface);transition:background .12s}
  .cell:hover{background:var(--surface2)}
  .cell.road{background:var(--road);cursor:default}
  .cell.resid{background:#FAECE7;cursor:default}
  .cell.port{background:#E1F5EE;color:#085041;cursor:default}
  .cell.dest{background:#E6F1FB;color:#0C447C;cursor:default}
  .cell.onpath{background:#FAC775;color:#633806}
  .cell.onpath.resid{background:#F0997B;color:#4A1B0C}
  .cell .seq{font-size:11px;opacity:.85}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .stat{background:var(--surface2);border-radius:8px;padding:12px 16px}
  .stat .lab{font-size:13px;color:var(--text2)}
  .stat .val{font-size:24px;font-weight:500}
  .stat .val small{font-size:14px;color:var(--text2);font-weight:400}
  .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--text2);margin:16px 0}
  .leg span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block}
  #msg{font-size:14px;color:var(--text2);min-height:20px;margin-bottom:10px}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;
    border:.5px solid rgba(0,0,0,.25);background:transparent;color:var(--text);cursor:pointer}
  button:hover{background:var(--surface2)}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Port drayage routing game</h1>
  <p class="sub">Move 3 containers from the Port to the warehouse before gate time runs out. Diagonals allowed. Cutting through residential blocks is faster but pollutes.</p>

  <div class="leg">
    <span><i class="sw" style="background:#5DCAA5"></i>Port (start)</span>
    <span><i class="sw" style="background:#85B7EB"></i>Warehouse (goal)</span>
    <span><i class="sw" style="background:#F0997B"></i>Residential street</span>
    <span><i class="sw" style="background:#e8e6dd;border:.5px solid rgba(0,0,0,.25)"></i>Bypass road</span>
  </div>

  <div class="board" id="board"></div>

  <div class="stats">
    <div class="stat"><div class="lab">Time used</div><div class="val"><span id="time">0</span><small>/20</small></div></div>
    <div class="stat"><div class="lab">Containers moved</div><div class="val"><span id="moved">0</span><small>/3</small></div></div>
    <div class="stat"><div class="lab">Pollution score</div><div class="val" id="poll">0</div></div>
  </div>

  <div id="msg"></div>

  <div class="controls">
    <button id="deliver">Deliver this load</button>
    <button id="reset">Reset board</button>
  </div>
</div>
<script>
(function(){
  const COLS=7,ROWS=7;
  const port={r:6,c:0}, dest={r:0,c:6};
  const resid=new Set(["5-1","4-2","3-3","2-4","1-5","4-1","3-2","2-3","1-4"]);
  const board=document.getElementById("board");
  let path=[], moved=0, time=0, poll=0, done=false;
  const TIME_BUDGET=20;

  const key=(r,c)=>r+"-"+c;
  const isResid=(r,c)=>resid.has(key(r,c));

  function render(){
    board.innerHTML="";
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const d=document.createElement("div");
      d.className="cell";
      if(r===port.r&&c===port.c){d.classList.add("port");d.textContent="Port";}
      else if(r===dest.r&&c===dest.c){d.classList.add("dest");d.textContent="WH";}
      else if(isResid(r,c)){d.classList.add("resid");}
      else{d.classList.add("road");}
      const idx=path.findIndex(p=>p.r===r&&p.c===c);
      if(idx>=0){d.classList.add("onpath");if(isResid(r,c))d.classList.add("resid");
        const s=document.createElement("span");s.className="seq";s.textContent=(idx+1);d.appendChild(s);}
      d.onclick=()=>click(r,c);
      board.appendChild(d);
    }
    document.getElementById("time").textContent=time;
    document.getElementById("moved").textContent=moved;
    document.getElementById("poll").textContent=poll;
  }

  const adjacent=(a,b)=>{const dr=Math.abs(a.r-b.r),dc=Math.abs(a.c-b.c);return dr<=1&&dc<=1&&(dr+dc>0);};

  function click(r,c){
    if(done)return;
    const msg=document.getElementById("msg");
    if(r===dest.r&&c===dest.c){msg.textContent="That's the warehouse — build a path next to it, then deliver.";return;}
    if(r===port.r&&c===port.c){path=[];render();msg.textContent="Path cleared. Click cells outward from the port.";return;}
    const cell={r,c};
    const last=path.length?path[path.length-1]:port;
    const existing=path.findIndex(p=>p.r===r&&p.c===c);
    if(existing>=0){path=path.slice(0,existing);render();msg.textContent="Path trimmed.";return;}
    if(!adjacent(last,cell)){msg.textContent="Pick a cell touching your current path — diagonals are allowed.";return;}
    path.push(cell);
    render();
    msg.textContent="";
  }

  function deliver(){
    if(done)return;
    const msg=document.getElementById("msg");
    if(!path.length){msg.textContent="Lay down a route from the port first.";return;}
    const last=path[path.length-1];
    if(!adjacent(last,dest)){msg.textContent="Your path doesn't reach the warehouse yet.";return;}
    const steps=path.length+1;
    const residCount=path.filter(p=>isResid(p.r,p.c)).length;
    const remaining=2-moved;
    if(time+steps>TIME_BUDGET){msg.textContent="Not enough gate time left for that route. Cut through the neighborhood to make the deadline.";return;}
    if(time+steps+remaining*6>TIME_BUDGET){msg.textContent="Careful — take this long a route and you won't have gate time left for the loads still waiting.";return;}
    time+=steps; moved+=1; poll+=residCount*10;
    path=[];
    if(moved>=3){
      done=true;
      let verdict;
      if(poll<=20)verdict="You squeezed nearly every load onto the bypass — barely beat the clock. Real drivers rarely have this slack.";
      else if(poll<=50)verdict="A mix of clean and dirty routes. This is the realistic tradeoff under a tight deadline.";
      else verdict="Most loads cut straight through. Fast and on time, but West Oakland breathes the cost.";
      msg.textContent="All 3 loads delivered. Pollution score "+poll+". "+verdict;
    } else {
      msg.textContent="Load delivered ("+residCount+" residential blocks, "+steps+" time). "+(3-moved)+" left, "+(TIME_BUDGET-time)+" gate time remaining.";
    }
    render();
  }

  document.getElementById("deliver").onclick=deliver;
  document.getElementById("reset").onclick=()=>{path=[];moved=0;time=0;poll=0;done=false;document.getElementById("msg").textContent="";render();};
  render();
})();
</script>
</body>
</html>
